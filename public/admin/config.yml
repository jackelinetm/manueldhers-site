# === Configuración del panel (Sveltia CMS, compatible con Decap) ===
backend:
  name: github
  repo: USUARIO-GITHUB/manueldhers-site   # <-- cambiar por tu usuario/repositorio
  branch: main
  # URL del worker de autenticación (sveltia-cms-auth en Cloudflare). Ver README, paso 4.
  base_url: https://TU-WORKER.workers.dev

# Guarda cambios como Pull Request en vez de escribir directo (opcional, más seguro):
# publish_mode: editorial_workflow

media_folder: "public/uploads"
public_folder: "/uploads"

locale: es

collections:
  # ---------------- BLOG ----------------
  - name: blog
    label: "Blog"
    label_singular: "Entrada"
    folder: "src/content/blog"
    create: true
    slug: "{{fields.slug}}"          # el nombre de archivo sigue al slug (la URL)
    identifier_field: title
    fields:
      - { name: title, label: "Título", widget: string }
      - { name: date, label: "Fecha", widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { name: slug, label: "Slug (URL) — no cambiar en entradas ya publicadas", widget: string, hint: "La entrada vivirá en manueldhers.com/EL-SLUG/" }
      - name: category
        label: "Categoría"
        widget: select
        required: false
        options: ["Diario de Campo", "Migración Inmóvil", "Cuidados", "Crisis venezolana", "Venezuela", "Opinión"]
      - { name: description, label: "Descripción (SEO / resumen)", widget: text, required: false }
      - { name: cover, label: "Imagen destacada", widget: image, required: false }
      - { name: draft, label: "Borrador", widget: boolean, default: false }
      - { name: body, label: "Contenido", widget: markdown }

  # ---------------- PUBLICACIONES ----------------
  - name: publicaciones
    label: "Publicaciones"
    label_singular: "Publicación"
    folder: "src/content/publicaciones"
    create: true
    slug: "{{year}}-{{slug}}"
    identifier_field: title
    fields:
      - { name: title, label: "Título", widget: string }
      - { name: authors, label: "Autores", widget: string, default: "D'Hers, M." }
      - { name: year, label: "Año", widget: number, value_type: int }
      - name: tipo
        label: "Tipo"
        widget: select
        options: ["Prensa", "Artículos", "Trabajos académicos"]
        default: "Artículos"
      - { name: venue, label: "Revista / Editorial / Medio", widget: string, required: false }
      - { name: url, label: "Enlace al texto", widget: string, required: false }
      - { name: doi, label: "DOI", widget: string, required: false }
      - { name: citation, label: "Cómo citar", widget: text, required: false }
      - name: downloads
        label: "Descargas"
        widget: list
        required: false
        fields:
          - { name: label, label: "Etiqueta (p. ej. Español / PDF)", widget: string }
          - { name: url, label: "Enlace", widget: string }
      - { name: order, label: "Orden (opcional)", widget: number, required: false, value_type: int }
      - { name: body, label: "Notas (opcional)", widget: markdown, required: false }

  # ---------------- PÁGINAS FIJAS ----------------
  - name: pages
    label: "Páginas"
    files:
      - name: home
        label: "Home"
        file: "src/content/pages/home.md"
        fields:
          - { name: title, label: "Título (interno)", widget: hidden, default: "Home" }
          - { name: eyebrow, label: "Palabras clave (línea gris arriba del nombre)", widget: string, required: false, hint: "El símbolo ◆ (si lo incluyes) se muestra en terracota. Ej: 'Antropología · Cuidado · Venezuela ◆ 2026'" }
          - { name: role, label: "Rol / afiliación (línea terracota)", widget: string, required: false, hint: "Ej: 'Doctor en Antropología · URV'" }
          - { name: body, label: "Descripción de la investigación", widget: markdown, hint: "Aparece en la home a la derecha del nombre. Usa **negrita** para acentuar palabras en terracota." }
      - name: bio
        label: "Bio"
        file: "src/content/pages/bio.md"
        fields:
          - { name: title, label: "Título", widget: string }
          - { name: description, label: "Descripción (SEO)", widget: text, required: false }
          - name: formacion
            label: "Formación (sidebar)"
            widget: list
            required: false
            hint: "Cada entrada: título abreviado + detalle. Ej: 'Ph.D.' — 'URV · 2025'"
            fields:
              - { name: degree, label: "Título (abreviado)", widget: string }
              - { name: detail, label: "Detalle", widget: string }
          - name: ubicacion
            label: "Ubicación (sidebar)"
            widget: list
            required: false
            hint: "Cada entrada: etiqueta + valor. Ej: 'Reside' — 'Tarragona, España'"
            fields:
              - { name: label, label: "Etiqueta", widget: string }
              - { name: value, label: "Valor", widget: string }
          - name: perfiles
            label: "Perfiles / Enlaces (sidebar)"
            widget: list
            required: false
            hint: "Enlaces académicos y sociales. Ej: 'ORCID' → 'https://orcid.org/…' — texto visible: '0000-0002-…'"
            fields:
              - { name: label, label: "Etiqueta corta (ej. ORCID)", widget: string }
              - { name: url, label: "Enlace completo (https://…)", widget: string }
              - { name: display, label: "Texto visible", widget: string }
          - name: topics
            label: "Temas (sidebar)"
            widget: list
            required: false
            hint: "Aparecen con un ◆ delante."
            field: { name: tema, label: "Tema", widget: string }
          - { name: body, label: "Contenido", widget: markdown }
